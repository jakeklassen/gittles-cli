name: release

# Builds the CLI for every platform and publishes a GitHub release whose asset names
# and checksums file are exactly what source/update.ts expects.
#
# Everything cross-compiles from one Linux runner: the binary is 100% static tier, and
# only --dynamic builds are host-native. clang is shimmed to `zig cc` because scriptc's
# vendored mbedtls/quickjs builds invoke `clang` directly, ignoring SCRIPTC_CC.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release, e.g. 0.2.0'
        required: true

permissions:
  contents: write
  id-token: write # sigstore build provenance
  attestations: write

env:
  ZIG_VERSION: '0.16.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # scriptc's typecheck gate needs @types/node; without it, it falls back to its
      # own narrower ambient declarations and rejects things like stdin's 'data' event.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the toolchain lands, so the checks only ever see repo files.
      - name: Check
        run: pnpm test

      # Extracted outside the checkout: a toolchain unpacked into the workspace gets
      # picked up by the formatter and the linter.
      - name: Install zig and shim it as clang
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
          echo "${PWD}/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          mkdir -p "${PWD}/shim"
          printf '#!/bin/sh\nexec zig cc "$@"\n' > "${PWD}/shim/clang"
          chmod +x "${PWD}/shim/clang"
          echo "${PWD}/shim" >> "$GITHUB_PATH"

      - name: Stamp the version into the binary
        run: |
          sed -i "s/^export const VERSION = '.*';/export const VERSION = '${{ steps.version.outputs.version }}';/" source/update.ts
          grep '^export const VERSION' source/update.ts

      - name: Build every target
        run: |
          set -eux
          mkdir -p dist

          # Asset names must match assetNameFor():
          # `gittles-${process.platform}-${process.arch}`.
          build() {
            SCRIPTC_CC=zigcc SCRIPTC_TARGET="$2" \
              ./node_modules/.bin/scriptc build source/main.ts -o "dist/$1"
          }

          build gittles-linux-x64      x86_64-linux-gnu.2.36
          build gittles-linux-arm64    aarch64-linux-gnu.2.36
          build gittles-darwin-arm64   aarch64-macos
          build gittles-darwin-x64     x86_64-macos

          # EXPERIMENTAL: this links, but scriptc's Windows port does not yet include
          # the socket stack (net/http/https/tls) or child_process, so login/sync/update
          # are expected to fail at runtime. Published for testing, not for use.
          build gittles-win32-x64.exe  x86_64-windows-gnu || echo "windows build failed (expected)"

          # The Windows link emits debug symbols beside the exe; they match the
          # gittles-* glob used for checksums, attestation and upload.
          rm -f dist/*.pdb

          chmod +x dist/*
          ls -la dist

      - name: Checksums
        working-directory: dist
        run: |
          # `<digest>  <name>` — the format digestFor() parses.
          sha256sum gittles-* > checksums.txt
          cat checksums.txt

      # Sigstore attestations are not available to user-owned private repos. This
      # starts working by itself if the repo is made public.
      - name: Attest build provenance
        if: ${{ github.event.repository.private != true }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/gittles-*

      - name: Smoke-test the native binary
        working-directory: dist
        run: |
          test "$(./gittles-linux-x64 version)" = "${{ steps.version.outputs.version }}"
          ./gittles-linux-x64 help | head -3

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Native gittles build. Install: \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh\`" \
            gittles-* checksums.txt
